# Lightweight PR checks for enterprise release confidence.
name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests, auth & rules QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run qa:firestore-rules
      - run: npm run qa:google-auth
      - name: Dependency audit (high+; non-blocking known Next/Firebase advisories)
        run: npm audit --omit=dev --audit-level=high || true
