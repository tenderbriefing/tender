# Lightweight PR checks for enterprise release confidence.
name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit, integration, QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run qa:firestore-rules
      - run: npm run qa:google-auth
      - run: npm run qa:route-retirement
      - run: npm run qa:config
      - run: npm run qa:secrets-scan
      - name: Dependency audit (critical gate + allowlist)
        run: node scripts/npm-audit-gate.js

  firestore_rules_emulator:
    name: Firestore emulator IDOR matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run test:firestore-emulator

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  e2e_public:
    name: Playwright public/a11y gates
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Build with E2E auth stub gate enabled (localhost + Playwright only)
        run: NEXT_PUBLIC_E2E_AUTH_STUB_ALLOWED=1 npm run build
      - run: npm run test:e2e
        env:
          CI: 'true'
