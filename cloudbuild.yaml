# Google Cloud Build — deploy TenderBriefing to Cloud Run

# Usage: gcloud builds submit --config cloudbuild.yaml --project tenderbriefing-34679 --region=africa-south1



substitutions:

  _SERVICE: tenderbriefing

  _REGION: africa-south1



steps:

  - name: gcr.io/cloud-builders/docker

    args:

      - build

      - -t

      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/tenderbriefing/${_SERVICE}:$BUILD_ID

      - -t

      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/tenderbriefing/${_SERVICE}:latest

      - --build-arg

      - NEXT_PUBLIC_SITE_URL=https://www.tenderbriefing.co.za

      - --build-arg

      - NEXT_PUBLIC_FOUNDER_USER_INTELLIGENCE=true

      - --build-arg

      - NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=false

      - --build-arg

      - NEXT_PUBLIC_PROCUREMENT_INTELLIGENCE_ENABLED=false

      - --build-arg

      - NEXT_PUBLIC_PRIVATE_TENDER_ORGANISATION_WORKSPACE_ENABLED=true

      - .



  - name: gcr.io/cloud-builders/docker

    args:

      - push

      - --all-tags

      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/tenderbriefing/${_SERVICE}



  - name: gcr.io/google.com/cloudsdktool/cloud-sdk

    entrypoint: gcloud

    args:

      - run

      - deploy

      - ${_SERVICE}

      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/tenderbriefing/${_SERVICE}:$BUILD_ID

      - --region=${_REGION}

      - --platform=managed

      - --port=8080

      - --memory=1Gi

      - --cpu=1

      - --timeout=300

      - --min-instances=0

      - --max-instances=3

      - --allow-unauthenticated

      - --set-env-vars=STORAGE_ADAPTER=firestore,FIREBASE_PROJECT_ID=tenderbriefing-34679,FIREBASE_STORAGE_BUCKET=tenderbriefing-34679.firebasestorage.app,NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=tenderbriefing-34679.firebasestorage.app,NODE_ENV=production,NEXT_PUBLIC_SITE_URL=https://www.tenderbriefing.co.za,APP_URL=https://www.tenderbriefing.co.za,PAYFAST_MODE=live,PAYFAST_MERCHANT_EMAIL=info@tenderbriefing.co.za,FOUNDER_USER_INTELLIGENCE_ENABLED=true,NEXT_PUBLIC_FOUNDER_USER_INTELLIGENCE=true,FOUNDER_EMAIL_ALLOWLIST=info@tenderbriefing.co.za,NEXT_PUBLIC_GOOGLE_AUTH_ENABLED=false,PROCUREMENT_INTELLIGENCE_ENABLED=false,NEXT_PUBLIC_PROCUREMENT_INTELLIGENCE_ENABLED=false,AUTOMATION_REQUEST_TIMEOUT_MS=300000,AUTOMATION_SAFETY_MARGIN_MS=20000,AUTOMATION_BUDGET_MS=240000,RESEND_FROM_EMAIL=hello@tenderbriefing.co.za,BRIEFING_AUDIO_TRANSCRIPTION_ENABLED=true,BRIEFING_AI_REPORT_GENERATION_ENABLED=true,BRIEFING_REPORT_PROMPT_VERSION=v1

      # Prefer a sending-only Resend GSM secret. TENDERBRIEFING_API remains full-access until rotated.
      - --set-secrets=SYNC_SECRET=tenderbriefing-sync-secret:latest,FIREBASE_SERVICE_ACCOUNT_JSON=tenderbriefing-firebase-sa:latest,PAYFAST_MERCHANT_ID=payfast-merchant-id:latest,PAYFAST_MERCHANT_KEY=payfast-merchant-key:latest,PAYFAST_PASSPHRASE=payfast-passphrase:latest,RESEND_API_KEY=TENDERBRIEFING_API:latest,PROCUREMENT_INTELLIGENCE_PILOT_UIDS=procurement-intelligence-pilot-uids:latest,OPENAI_API_KEY=Open_ai_Secret_Key:latest



images:

  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/tenderbriefing/${_SERVICE}:$BUILD_ID

  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/tenderbriefing/${_SERVICE}:latest



options:

  logging: CLOUD_LOGGING_ONLY

  machineType: E2_HIGHCPU_8

  diskSizeGb: 100

